# Config exclusiva de tests. Sombrea src/main/resources/application.properties
# (el classpath de test va primero). Valores ficticios: ningun test debe
# necesitar credenciales reales ni tocar servicios externos.
spring.application.name=demo-test

spring.datasource.url=jdbc:mysql://localhost:3306/cinema
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

cloudinary.cloud-name=test-cloud
cloudinary.api-key=000000000000000
cloudinary.api-secret=test-api-secret-not-real

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test-password-not-real
app.mail.from=test@example.com

jwt.secret=test-only-jwt-secret-with-at-least-256-bits-of-length-for-hs256
jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:5173

stripe.secret-key=sk_test_notreal
stripe.publishable-key=pk_test_notreal
stripe.webhook-secret=whsec_notreal
