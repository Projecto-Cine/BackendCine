spring.application.name=demo

# ---------------------------------------------------------------------------
# NOTA: este fichero NO debe contener credenciales literales.
# Toda clave secreta se declara SIN valor por defecto a proposito: si falta la
# variable de entorno, la aplicacion no arranca. Es deliberado — un arranque
# con un secreto por defecto conocido es peor que un arranque fallido.
# Para desarrollo local: ver application.properties.example y setup-local.ps1
# ---------------------------------------------------------------------------

# Server — Render asigna su propio puerto via $PORT
server.port=${PORT:8080}

# Database — en Render setea DB_URL completa; localmente cae a localhost
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinema}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# Cloudinary — sin defaults: credenciales de cuenta
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Email
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp-relay.brevo.com}
app.mail.from=${MAIL_FROM}

# JWT — sin default: un secreto por defecto publico permite forjar tokens
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — lista blanca explicita, separada por comas. Nunca "*"
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Stripe (modo test) — sin defaults: una pasarela a medio configurar cobra mal
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
